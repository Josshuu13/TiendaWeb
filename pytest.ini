[pytest]
DJANGO_SETTINGS_MODULE = tiendaWeb.settings
python_files = tests.py test_*.py
testpaths = catalogo carrito cuentas pedidos e2e
filterwarnings =
    ignore:No directory at:UserWarning
# Las pruebas en navegador (e2e) se corren aparte: pytest -m e2e
addopts = -m "not e2e"
markers =
    e2e: prueba en navegador real con Playwright
